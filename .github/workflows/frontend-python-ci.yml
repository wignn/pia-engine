name: Frontend and Python CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

jobs:
  rust-market-services:
    name: Rust market services
    runs-on: ubuntu-latest
    env:
      NATS_URL: nats://127.0.0.1:4222
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Start NATS with JetStream
        run: |
          docker run -d --name pia-ci-nats -p 4222:4222 nats:2.11-alpine -js -m 8222
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8222/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs pia-ci-nats
          exit 1

      - name: Compile changed Rust applications
        run: cargo check -p api-gateway -p ingestion-gateway -p market-data -p realtime-gateway

      - name: Rust contract and NATS integration tests
        run: cargo test -p atlsd-contracts -p atlsd-eventbus -p ingestion-gateway -p market-data -p realtime-gateway

  pia:
    name: pia (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pia
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Fetch root submodules only; apps/pia contains a stale nested old-portal gitlink.
          submodules: true

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build (includes type checking)
        run: bun run build

  terminal:
    name: terminal (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/terminal
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build (includes type checking)
        run: bun run build

  public-web:
    name: public-web (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/public-web
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types and Svelte components
        run: bun run check

      - name: Lint with ESLint
        run: bunx eslint .

      - name: Build
        run: bun run build

  admin:
    name: admin (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (includes type checking)
        run: bun run build


  python:
    name: Python services
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rsshub-connector dependencies
        run: python -m pip install -r services/rsshub-connector/requirements.txt

      - name: rsshub-connector tests
        working-directory: services/rsshub-connector
        run: python -m unittest discover -s tests -v

      - name: analyzer syntax check
        run: python -m compileall -q services/analyzer

      - name: trading-model syntax and package metadata check
        run: |
          python -m compileall -q services/trading-model/src
          python -c "import pathlib, tomllib; tomllib.loads(pathlib.Path('services/trading-model/pyproject.toml').read_text())"
