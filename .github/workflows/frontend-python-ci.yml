name: Frontend and Python CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  pia:
    name: pia (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pia
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build (includes type checking)
        run: bun run build

  public-web:
    name: public-web (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/public-web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run check

      - name: Build
        run: bun run build

  python:
    name: Python services
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: social-worker tests
        run: python -m unittest discover -s services/social-worker/tests -v


      - name: analyzer syntax check
        run: python -m compileall -q services/analyzer
