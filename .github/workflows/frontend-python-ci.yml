name: Frontend and Python CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

jobs:
  rust-market-services:
    name: Rust market services
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile API and market-data services
        run: cargo check -p api-gateway -p market-data

  pia:
    name: pia (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pia
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Fetch root submodules only; apps/pia contains a stale nested old-portal gitlink.
          submodules: true

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build (includes type checking)
        run: bun run build

  terminal:
    name: terminal (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/terminal
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build (includes type checking)
        run: bun run build


  python:
    name: Python services
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rsshub-connector dependencies
        run: python -m pip install -r services/rsshub-connector/requirements.txt

      - name: rsshub-connector tests
        working-directory: services/rsshub-connector
        run: python -m unittest discover -s tests -v

      - name: analyzer syntax check
        run: python -m compileall -q services/analyzer

      - name: trading-model syntax and package metadata check
        run: |
          python -m compileall -q services/trading-model/src
          python -c "import pathlib, tomllib; tomllib.loads(pathlib.Path('services/trading-model/pyproject.toml').read_text())"
