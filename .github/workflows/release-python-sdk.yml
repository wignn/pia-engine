name: Release Python SDK to PyPI

on:
  push:
    tags:
      - 'py-v[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag / version to publish to PyPI'
        required: false
        default: 'latest'

jobs:
  publish:
    name: Build, Test & Publish piaa-sdk to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: write # For GitHub Release
      id-token: write # For PyPI Trusted Publishing (OIDC)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build httpx websockets

      - name: Run Unit Tests
        run: |
          cd packages/pia-python
          python -m unittest discover -s tests -p "test_*.py"

      - name: Build wheel and source tarball
        run: |
          cd packages/pia-python
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/pia-python/dist/
          skip-existing: true
        env:
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
