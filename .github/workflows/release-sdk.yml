name: Release SDK to npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag / release version to publish'
        required: false
        default: 'latest'

jobs:
  publish:
    name: Build, Test & Publish @piaa/sdk
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating GitHub Releases
      id-token: write # Required for npm provenance cryptographic signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for npm registry authentication
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run SDK Unit Tests
        run: |
          cd packages/api-client
          bun test

      - name: Build SDK bundle & TypeScript declarations
        run: |
          cd packages/api-client
          bun run build

      - name: Publish to npm with Provenance
        run: |
          cd packages/api-client
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "@piaa/sdk ${{ github.ref_name }}"
          generate_release_notes: true
          files: packages/api-client/dist/*
