# ATLSD shared infrastructure stack (SINGLETON).
#
# These containers exist once regardless of deployment color. Blue/Green
# application stacks (prod.app.yml) attach to the SAME external network and
# reach these services by their stable DNS names:
#   postgres / clickhouse / redis / nats
#
# External volumes pin the pre-existing "compose_*" volumes so data written by
# the legacy single-stack prod.yml is never orphaned.
name: atlsd-infra

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    container_name: postgres-prod
    image: postgres:16-alpine
    env_file:
      - ../env/.env.db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    logging: *default-logging
    networks:
      - private

  clickhouse:
    container_name: clickhouse-prod
    image: clickhouse/clickhouse-server:24.8-alpine
    env_file:
      - ../env/.env.datastores
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    restart: always
    logging: *default-logging
    networks:
      - private

  redis:
    container_name: redis-prod
    image: redis:7-alpine
    # Shell form so $REDIS_PASSWORD expands INSIDE the container
    # (exec-form would set the literal string "${REDIS_PASSWORD}").
    command: ["/bin/sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    env_file:
      - ../env/.env.datastores
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    logging: *default-logging
    networks:
      - private

  nats:
    container_name: nats
    image: nats:2.10-alpine
    command: "-js -sd /data"
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_data:/data
    restart: always
    logging: *default-logging
    networks:
      - private

volumes:
  postgres_data:
    name: compose_postgres_data
    external: true
  clickhouse_data:
    name: compose_clickhouse_data
    external: true
  redis_data:
    name: compose_redis_data
    external: true
  nats_data:
    name: compose_nats_data
    external: true

networks:
  private:
    name: atlsd_private
    driver: bridge
