x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-prod
    restart: always
    logging: *default-logging
    env_file:
      - ../env/.env.db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlsd -d core"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: clickhouse-prod
    restart: always
    logging: *default-logging
    env_file:
      - ../env/.env.datastores
    environment:
      CLICKHOUSE_DB: market
      CLICKHOUSE_USER: default
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"$$CLICKHOUSE_PASSWORD\" --query SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis-prod
    restart: always
    logging: *default-logging
    env_file:
      - ../env/.env.datastores
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: nats
    restart: unless-stopped
    logging: *default-logging
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  social-worker:
    container_name: social-worker
    image: wign/atlsd-social-worker:${ATLSD_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.social-worker
    env_file:
      - ../env/.env.social-worker
    environment:
      TWITTER_DB: /data/accounts.db
      NATS_URL: nats://nats:4222
      NATS_SUBJECT: social.posts
    volumes:
      - social_worker_data:/data
    depends_on:
      nats:
        condition: service_started
    restart: always
    logging: *default-logging
    networks:
      - private

  scrapy:
    container_name: scrapy
    image: wign/atlsd-scrapy:${ATLSD_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.scrapy
      args:
        - DOCKER_BUILD_TYPE=release
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_started
    restart: always
    logging: *default-logging
    networks:
      - private

  db-migrate:
    image: wign/atlsd-db-migrate:${ATLSD_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.db-migrate
      args:
        - DOCKER_BUILD_TYPE=release
    container_name: db-migrate
    restart: "no"
    logging: *default-logging
    env_file:
      - ../env/.env.db
      - ../env/.env.datastores
    environment:
      MIGRATIONS_CORE_DIR: /migrations/core
      MIGRATIONS_CLICKHOUSE_DIR: /migrations/clickhouse
      CLICKHOUSE_URL: http://clickhouse:8123
      # Baselines keep an already-migrated store from re-running old files;
      # fresh installs apply everything from zero.
      DB_MIGRATE_BASELINE_VERSION: "17"
      DB_MIGRATE_CLICKHOUSE_BASELINE_VERSION: "1"
    volumes:
      - ../../db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - private

  api-gateway:
    container_name: api-gateway
    image: wign/atlsd-api-gateway:${ATLSD_IMAGE_TAG:-latest}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api-gateway
      args:
        - DOCKER_BUILD_TYPE=release
    env_file:
      - ../env/.env.api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      market-data:
        condition: service_started
      news-service:
        condition: service_started
      intelligence-service:
        condition: service_started
    restart: always
    logging: *default-logging
    networks:
      - private

  market-data:
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8010/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.market-data
      args:
        - DOCKER_BUILD_TYPE=release
    env_file:
      - ../env/.env.market-data
      - ../env/.env.datastores
    environment:
      EVENTBUS_MODE: nats
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      nats:
        condition: service_started
    restart: always
    logging: *default-logging
    networks:
      - private

  realtime-gateway:
    container_name: realtime-gateway
    image: wign/atlsd-realtime-gateway:${ATLSD_IMAGE_TAG:-latest}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8020/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.realtime-gateway
      args:
        - DOCKER_BUILD_TYPE=release
    env_file:
      - ../env/.env.realtime-gateway
    environment:
      EVENTBUS_MODE: nats
      NATS_URL: nats://nats:4222
    ports:
      - "${REALTIME_GATEWAY_PORT:-8020}:8020"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    restart: always
    logging: *default-logging
    networks:
      - private

  bot:
    container_name: bot
    image: wign/atlsd-bot:${ATLSD_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.bot
      args:
        - DOCKER_BUILD_TYPE=release
    env_file:
      - ../env/.env.bot
    environment:
      API_GATEWAY_URL: http://api-gateway:8000
      REALTIME_GATEWAY_WS_URL: ws://realtime-gateway:8020/ws/v1
      DATABASE_PATH: /data/bot.db
    volumes:
      - bot_data:/data
    depends_on:
      api-gateway:
        condition: service_started
      realtime-gateway:
        condition: service_started
    restart: always
    logging: *default-logging
    networks:
      - private

  news-service:
    container_name: news-service
    image: wign/atlsd-news-service:${ATLSD_IMAGE_TAG:-latest}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8030/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.news-service
      args:
        - DOCKER_BUILD_TYPE=release
    env_file:
      - ../env/.env.news-service
    environment:
      EVENTBUS_MODE: nats
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
    restart: always
    logging: *default-logging
    networks:
      - private

  intelligence-service:
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8040/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.intelligence-service
      args:
        - DOCKER_BUILD_TYPE=release
    env_file:
      - ../env/.env.intelligence-service
      - ../env/.env.datastores
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      analyzer:
        condition: service_started
    restart: always
    logging: *default-logging
    networks:
      - private

  control-plane:
    container_name: world-control-plane
    image: wign/atlsd-control-plane:${ATLSD_IMAGE_TAG:-latest}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.control-plane
      args:
        - DOCKER_BUILD_TYPE=release
    env_file:
      - ../env/.env.control-plane
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: always
    logging: *default-logging
    networks:
      - private


  ingestion-gateway:
    container_name: ingestion-gateway
    image: wign/atlsd-ingestion:${ATLSD_IMAGE_TAG:-latest}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8091/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.ingestion
      args:
        - DOCKER_BUILD_TYPE=release
    env_file:
      - ../env/.env.ingestion
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    restart: always
    logging: *default-logging
    networks:
      - private

  analyzer:
    container_name: world-analyzer-prod
    image: wign/atlsd-analyzer:${ATLSD_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.analyzer
    ports:
      - "127.0.0.1:5000:5000"
    restart: always
    logging: *default-logging
    env_file:
      - ../env/.env.analyze
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_started
    networks:
      - private
  
  # pia:
  #   container_name: pia
  #   image: wign/atlsd-pia:latest
  #   env_file:
  #     - ../env/.env.pia
  #   environment:
  #     CONTROL_PLANE_INTERNAL_URL: http://control-plane:8080
  #   ports:
  #     - "${PIA_PORT:-5175}:3000"
  #   depends_on:
  #     control-plane:
  #       condition: service_started
  #   restart: unless-stopped
  #   networks:
  #     - private

  public-web:
    image: wign/atlsd-public-web:${ATLSD_IMAGE_TAG:-latest}
    env_file:
      - ../env/.env.public-web
    container_name: atlsd-public-web
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.public-web
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5173
    ports:
      - "${PUBLIC_WEB_PORT:-5173}:5173"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - private

networks:
  private:
    driver: bridge

volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
  nats_data:
  bot_data:
  social_worker_data: