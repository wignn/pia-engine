# ATLSD traffic router — rewritten by deploy-blue-green.sh.
# Active color ports: api=8001 ws=8021 web=5274 term=5171 (public ports stay fixed).

upstream api_gateway_backend {
    server 172.17.0.1:8001;
    keepalive 32;
}

upstream realtime_gateway_backend {
    server 172.17.0.1:8021;
    keepalive 16;
}

upstream public_web_backend {
    server 172.17.0.1:5274;
    keepalive 16;
}

upstream terminal_backend {
    server 172.17.0.1:5171;
    keepalive 16;
}

# ---- REST API + WebSocket (public hosts 8000 / 8020) ----------------------
server {
    listen 80;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 3;
    gzip_min_length 1024;
    gzip_types application/json text/plain application/javascript text/css;

    location = /healthz {
        access_log off;
        return 200 "router-ok\n";
    }

    location /metrics {
        proxy_pass http://realtime_gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Realtime HTTP API (ticket issuance) + WS endpoints under /api/v1/ws
    location /api/v1/ws {
        proxy_pass http://realtime_gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        tcp_nodelay on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://api_gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws {
        proxy_pass http://realtime_gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        tcp_nodelay on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ---- Frontend public-web (public host 5173) -------------------------------
server {
    listen 81;

    location / {
        proxy_pass http://public_web_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ---- Frontend terminal (public host 5175) ---------------------------------
server {
    listen 82;

    location / {
        proxy_pass http://terminal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
