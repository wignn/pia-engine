# ATLSD traffic router — upstream file rewritten by deploy-blue-green.sh.
# Default: BLUE active.

upstream api_gateway_backend {
    server 172.17.0.1:8000;
}

upstream realtime_gateway_backend {
    server 172.17.0.1:8020;
}

server {
    listen 80;

    # Lightweight liveness endpoint for the router itself.
    location = /healthz {
        access_log off;
        return 200 "router-ok\n";
    }

    # REST API -> api-gateway (active color)
    location / {
        proxy_pass http://api_gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket -> realtime-gateway (active color)
    location /ws {
        proxy_pass http://realtime_gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
