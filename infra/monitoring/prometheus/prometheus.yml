global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: realtime-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["172.17.0.1:8020"]

  - job_name: market-data
    metrics_path: /metrics
    static_configs:
      - targets: ["172.17.0.1:8011"]

  - job_name: news-service
    metrics_path: /metrics
    static_configs:
      - targets: ["172.17.0.1:8031"]

  - job_name: ingestion-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["ingestion-gateway:8091"]

  # HTTP Blackbox probes (Status, latency, SSL)
  - job_name: service-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://172.17.0.1:8000/health
        labels:
          group: atlsd-services
          service: api-gateway
      - targets:
          - http://172.17.0.1:8011/health
        labels:
          group: atlsd-services
          service: market-data
      - targets:
          - http://172.17.0.1:8031/health
        labels:
          group: atlsd-services
          service: news-service
      - targets:
          - http://172.17.0.1:8041/health
        labels:
          group: atlsd-services
          service: intelligence-service
      - targets:
          - http://172.17.0.1:8021/health
        labels:
          group: atlsd-services
          service: realtime-gateway
      - targets:
          - http://172.17.0.1:5173/
        labels:
          group: atlsd-services
          service: public-web
      - targets:
          - http://172.17.0.1:5176/
        labels:
          group: atlsd-services
          service: pia-portal
      - targets:
          - http://172.17.0.1:5177/
        labels:
          group: atlsd-services
          service: mission-control
      - targets:
          - https://atlsd.wign.dev/
        labels:
          group: atlsd-services
          service: public-domain
      - targets:
          - http://world-control-plane:8080/health
        labels:
          group: atlsd-services
          service: world-control-plane
      - targets:
          - http://ingestion-gateway:8091/health
        labels:
          group: atlsd-services
          service: ingestion-gateway
      - targets:
          - http://clickhouse-prod:8123/ping
        labels:
          group: atlsd-services
          service: clickhouse-prod
      - targets:
          - http://172.18.0.2:8222/healthz
        labels:
          group: atlsd-services
          service: nats
      - targets:
          - http://172.17.0.1:8000/healthz
        labels:
          group: atlsd-services
          service: router-healthz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Core Datastores TCP probes (Postgres, Redis, NATS broker)
  - job_name: datastore-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - 172.18.0.3:5432
        labels:
          group: atlsd-datastores
          service: postgres-prod
      - targets:
          - 172.18.0.5:6379
        labels:
          group: atlsd-datastores
          service: redis-prod
      - targets:
          - 172.18.0.2:4222
        labels:
          group: atlsd-datastores
          service: nats-broker
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
