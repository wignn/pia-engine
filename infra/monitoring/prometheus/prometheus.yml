global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: nats
    metrics_path: /varz
    static_configs:
      - targets: ["nats:8222"]

  - job_name: realtime-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["172.17.0.1:8020"]

  - job_name: market-data
    metrics_path: /metrics
    static_configs:
      - targets: ["172.17.0.1:8000"]

  - job_name: news-service
    metrics_path: /metrics
    static_configs:
      - targets: ["news-service:8030"]

  - job_name: ingestion-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["ingestion-gateway:8091"]

  - job_name: service-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://172.17.0.1:8000/health
        labels:
          group: atlsd-services
          service: api-gateway
      - targets:
          - http://172.17.0.1:8000/health
        labels:
          group: atlsd-services
          service: market-data
      - targets:
          - http://172.17.0.1:8000/health
        labels:
          group: atlsd-services
          service: news-service
      - targets:
          - http://172.17.0.1:8000/health
        labels:
          group: atlsd-services
          service: intelligence-service
      - targets:
          - http://172.17.0.1:8020/health
        labels:
          group: atlsd-services
          service: realtime-gateway
      - targets:
          - http://172.17.0.1:5173/
        labels:
          group: atlsd-services
          service: public-web
      - targets:
          - https://atlsd.wign.dev/
        labels:
          group: atlsd-services
          service: public-domain
      - targets:
          - http://world-control-plane:8080/health
        labels:
          group: atlsd-services
          service: world-control-plane
      - targets:
          - http://ingestion-gateway:8091/health
        labels:
          group: atlsd-services
          service: ingestion-gateway
      - targets:
          - http://clickhouse-prod:8123/ping
        labels:
          group: atlsd-services
          service: clickhouse-prod
      - targets:
          - http://172.17.0.1:8000/healthz
        labels:
          group: atlsd-services
          service: router-healthz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
