[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "piaa-sdk"
version = "1.0.1"
description = "Official Python SDK for PIA Market Intelligence & Realtime Financial Platform"
readme = "README.md"
authors = [{ name = "Merrr", email = "wign@wign.dev" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.24.0",
]
keywords = ["pia", "atlsd", "market-data", "finance", "crypto", "trading", "sdk", "websocket"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://pia.wign.dev/portal/docs"
Repository = "https://github.com/wignn/atlsd"
Issues = "https://github.com/wignn/atlsd/issues"

[project.optional-dependencies]
realtime = [
    "websockets>=11.0.0",
]
all = [
    "websockets>=11.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pia*", "pia_sdk*"]

[tool.setuptools.package-data]
pia = ["py.typed"]
pia_sdk = ["py.typed"]
